  <title>hinahina://</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="art-stage" class="art-stage" aria-label="インタラクティブな背景"><div id="background-root"></div><div class="art-fallback" aria-hidden="true"></div></div>
  <div class="edge-shade" aria-hidden="true"></div>
  <a class="skip-link" href="#work-panel">Skip to work</a>
  <div class="interface" id="interface">
    <header class="site-header">
      <a class="brand" href="#works/web" aria-label="hinahina:// — ポートフォリオの最初の作品へ"><h1>hinahina://</h1></a>
      <nav class="category-tabs" role="tablist" aria-label="作品カテゴリ">
        <button role="tab" id="tab-web" aria-controls="work-panel" aria-selected="true" data-category="web">Web</button>
        <button role="tab" id="tab-visual" aria-controls="work-panel" aria-selected="false" tabindex="-1" data-category="visual">Visual</button>
        <button role="tab" id="tab-text" aria-controls="work-panel" aria-selected="false" tabindex="-1" data-category="text">Words</button>
        <button role="tab" id="tab-video" aria-controls="work-panel" aria-selected="false" tabindex="-1" data-category="video">Video</button>
        <button role="tab" id="tab-experiments" aria-controls="work-panel" aria-selected="false" tabindex="-1" data-category="experiments">Experiments</button>
      </nav>
      <nav class="profile-links" aria-label="hinahinaの活動先">
        <a href="https://x.com/hinahina_vr" target="_blank" rel="noopener noreferrer" aria-label="hinahinaのX（新しいタブ）" title="X"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l8.2-9.4L.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z"/></svg></a>

    </header>
    <main id="works" class="gallery">
      <section class="work-panel" id="work-panel" role="tabpanel" aria-labelledby="tab-web" tabindex="0"></section>
      <section id="scene-settings" class="scene-settings" aria-label="背景の設定" hidden>
        <div class="settings-head"><span>Background</span><button id="settings-close" aria-label="背景の設定を閉じる">×</button></div>
        <p class="background-state" id="art-state">Playing</p>
        <label for="scene-select">Artwork</label>
        <select id="scene-select"><option value="lilian-kaleido-loom">Lilian Kaleido Loom</option><option value="kelp-current">Botanical Tide</option><option value="fluid-chrome-stream">Gesture Cut Field</option></select>
        <label for="intensity">Light <output id="intensity-value">1.20</output></label><input id="intensity" type="range" min="0.4" max="2.5" step="0.05" value="1.2">
        <label for="motion">Motion <output id="motion-value">1.16</output></label><input id="motion" type="range" min="0.2" max="2" step="0.05" value="1.16">
        <p>From <a href="https://glsl-effects-showcase.pages.dev/" target="_blank" rel="noopener noreferrer">GLSL Effects Showcase</a></p>
      </section>
    </main>
    <section class="collection" aria-label="作品一覧"><div id="project-strip" class="project-strip"></div>
      <div class="canvas-controls">
        <button class="scene-control" id="settings-toggle" aria-expanded="false" aria-controls="scene-settings" aria-label="背景の設定"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14M7 2v6M13 7v6M8 12v6" stroke="currentColor"/></svg></button>
        <button class="motion-toggle scene-control" aria-label="アニメーションを一時停止" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button class="immerse-toggle scene-control" aria-label="作品の操作画面を隠す" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" stroke="currentColor"/></svg></button>
      </div>
    </section>
  </div>
  <button class="restore-ui" hidden>Back to works</button>
